{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/leavestyle.css' %}" />
    <title>Document</title>
  </head>
  <body>
    <h2>My Leave Applications</h2>
    <table border="2" class="leave_table">
      <tr>
        <th>Leave Type</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Reason</th>
        <th>Status</th>
      </tr>
      {% for i in leaves %}

      <tr>
        <td>{{i.leave_type}}</td>
        <td>{{i.start_date}}</td>
        <td>{{i.end_date}}</td>
        <td>{{i.reason}}</td>
        <td>{{i.status}}</td>
      </tr>
      {% empty %}
      <td>No leave application found</td>
      {% endfor %}
    </table>
    <p style="text-align: center">
      <a href="{% url 'staff_dashboard' %}">Back to staff dashboard </a>
    </p>
  </body>
</html>
